name: check
on: [push, pull_request]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: find tools tests -name '*.js' -print0 -o -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - run: node tools/check-docs.js
  carts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      # Limits and the mistakes in docs/dev/playbook.md
      - run: node tools/check.js --all
      # The console's synth: a song that plays once falls silent at its end
      - run: node tests/console/song-end.mjs
      # The PPU's effects (colour blending, brightness), and every cart renders through them as it did without
      - run: node tests/console/effects.mjs
      # Old carts (format version 1) sound exactly as they did on the old chip (docs/dev/sound-chip.md)
      - run: node tools/devkit/music/compat.mjs
      # ...and convert to the new chip faithfully; the new chip's voices, interpolation, echo, envelopes and cart format
      - run: node tools/devkit/music/compat.mjs --converted
      - run: node tests/audio/chip.mjs
      # The art kit: drawing, palettes, tile sharing, scenes, sprites, the files it writes and the viewers
      - run: python3 tools/devkit/art/selftest.py
      # The colour report: its colour maths, and a default-brown panel over the limit
      - run: node tools/devkit/art/colors.mjs --selftest
      # The starter: scaffolds a throwaway cart, packs, checks and tests it, and deletes it
      - run: node tools/new-cart.js --selftest
      # Random play for 3,000 frames on every cart: exceptions, wrong-voice effects, soft locks, frame time
      - run: node tools/devkit/soak.mjs --all
  verify:
    # The carts a pull request changes: audio script, packed cart, checks, soak and the cart's own tests.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: git fetch origin ${{ github.base_ref }}
      - run: node tools/verify.js --base origin/${{ github.base_ref }}
